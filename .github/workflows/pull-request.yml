name: Check pull request

# Builds and tests the proposed change. It never publishes anything.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - name: Type check (reports problems, does not block)
        run: npm run typecheck
        continue-on-error: true
      - run: npm test
      - run: npm run contrast
      - run: npm run build
      - run: npm run check
      - name: Keep the built site so you can download and inspect it
        uses: actions/upload-artifact@v4
        with:
          name: site-preview
          path: dist
          retention-days: 7
