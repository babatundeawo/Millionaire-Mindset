name: Build and deploy

# Runs every time something is merged into main (or when you press "Run workflow").
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time. A newer one waits for the current one to finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type check (reports problems, does not block)
        run: npm run typecheck
        continue-on-error: true
      - name: Game tests
        run: npm test
      - name: Colour contrast check
        run: npm run contrast
      - id: pages
        uses: actions/configure-pages@v6
      - name: Build
        run: npm run build
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}/
      - name: Check the built site
        run: npm run check
      - name: Lighthouse report (reports scores, does not block)
        uses: treosh/lighthouse-ci-action@v12
        continue-on-error: true
        with:
          staticDistDir: ./dist
          uploadArtifacts: true
          runs: 1
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5.0.1
