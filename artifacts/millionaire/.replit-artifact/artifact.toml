kind = "web"
previewPath = "/"
title = "Who Wants to Be a Millionaire"
version = "1.0.0"
id = "artifacts/millionaire"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20190

[services.development]
run = "pnpm --filter @workspace/millionaire run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/millionaire", "run", "build" ]
serve = "static"
publicDir = "artifacts/millionaire/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20190"
BASE_PATH = "/"
